<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family:sans-serif;padding:20px">
  <div id="ton-connect"></div>
  <p id="status">loading...</p>
  <script>
    const status = document.getElementById('status');
    const sources = [
      'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js',
      'https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js'
    ];
    function load(i) {
      if (i >= sources.length) {
        status.textContent = 'ERROR: could not load TonConnect library';
        return;
      }
      const s = document.createElement('script');
      s.src = sources[i];
      s.onload = init;
      s.onerror = () => load(i + 1);
      document.head.appendChild(s);
    }
    function init() {
      try {
        if (window.Telegram && Telegram.WebApp) Telegram.WebApp.ready();
        const ui = new TON_CONNECT_UI.TonConnectUI({
          manifestUrl: location.origin + '/tonconnect-manifest.json',
          buttonRootId: 'ton-connect'
        });
        status.textContent = 'not connected';
        ui.onStatusChange(w => {
          status.textContent = w ? 'connected: ' + w.account.address : 'not connected';
        });
      } catch (e) {
        status.textContent = 'ERROR: ' + e.message;
      }
    }
    load(0);
  </script>
</body>
</html>
