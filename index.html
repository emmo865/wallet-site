<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mega Lottery - Deposit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 20px; 
      background-color: #1c1c1c; 
      color: white; 
      text-align: center; 
    }
    h2 { margin-bottom: 5px; }
    p.subtitle { color: #888; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
    input { 
      width: 85%; 
      padding: 12px; 
      font-size: 18px; 
      border-radius: 10px; 
      border: 1px solid #333; 
      background-color: #2a2a2a;
      color: white;
      margin: 10px 0; 
      text-align: center;
    }
    button.pay-btn { 
      padding: 16px 20px; 
      font-size: 16px; 
      border-radius: 10px; 
      border: none; 
      background-color: #0088cc; 
      color: white; 
      cursor: pointer; 
      width: 90%; 
      font-weight: bold; 
      margin-top: 15px;
      transition: background 0.2s;
    }
    button.pay-btn:hover { background-color: #0077b3; }
    button.pay-btn:disabled { background-color: #555; cursor: not-allowed; }
    #status { margin: 15px 0; color: #aaa; font-size: 14px; }
    #pay-section { 
      display: none; 
      margin-top: 20px; 
      padding: 20px; 
      border: 1px solid #333; 
      border-radius: 12px; 
      background-color: #222;
    }
    .rate-info { font-size: 13px; color: #aaa; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h2>Deposit TON</h2>
  <p class="subtitle">Top up your game balance</p>
  
  <!-- Wallet Connect Button -->
  <div id="ton-connect"></div>

  <!-- Connection Status -->
  <p id="status">Loading...</p>

  <!-- Payment Section (Shown after connection) -->
  <div id="pay-section">
    <div class="rate-info">Rate: 1 TON = 1,000 Coins<br>Minimum: 0.5 TON</div>
    <p style="margin:0 0 10px 0; font-size: 14px;">Amount to deposit (TON):</p>
    <input type="number" id="amount" value="2" min="0.5" step="0.1" />
    <br>
    <button class="pay-btn" id="pay-btn">Pay & Deposit</button>
  </div>

  <script>
    const status = document.getElementById('status');
    const paySection = document.getElementById('pay-section');
    const payBtn = document.getElementById('pay-btn');
    const amountInput = document.getElementById('amount');
    
    let tonConnectUI = null;
    let currentWallet = null;

    // ⚠️ YOUR EXACT TON WALLET ADDRESS (FROM YOUR SCREENSHOT) ⚠️
    const MY_TON_WALLET = "UQC1AAJaC9IGTWNpjfxzBEfK-J9T29upIMuC5WLdeRPeb7qc";

    // 1. Load TonConnect Library
    const sources = [
      'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js',
      'https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js'
    ];

    function load(i) {
      if (i >= sources.length) {
        status.textContent = 'ERROR: could not load TonConnect library';
        return;
      }
      const s = document.createElement('script');
      s.src = sources[i];
      s.onload = init;
      s.onerror = () => load(i + 1);
      document.head.appendChild(s);
    }

    // 2. Initialize
    function init() {
      try {
        if (window.Telegram && Telegram.WebApp) Telegram.WebApp.ready();
        
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
          manifestUrl: location.origin + '/tonconnect-manifest.json',
          buttonRootId: 'ton-connect'
        });

        status.textContent = 'Wallet not connected';

        // 3. Handle Status Change
        tonConnectUI.onStatusChange(wallet => {
          if (wallet) {
            currentWallet = wallet;
            status.textContent = '✅ Wallet Connected: ' + wallet.account.address.substring(0, 6) + '...';
            paySection.style.display = 'block'; 
          } else {
            currentWallet = null;
            status.textContent = 'Wallet not connected';
            paySection.style.display = 'none';
          }
        });
      } catch (e) {
        status.textContent = 'ERROR: ' + e.message;
      }
    }

    // 4. Pay Button Click Event
    payBtn.addEventListener('click', async () => {
      if (!currentWallet) {
        alert('Please connect your wallet first.');
        return;
      }

      const amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount < 0.5) {
        alert('Minimum deposit amount is 0.5 TON.');
        return;
      }

      // Convert TON to nano (1 TON = 1,000,000,000 nano)
      const amountInNano = Math.floor(amount * 1000000000).toString();

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 600, // 10 minutes validity
        messages: [
          {
            address: MY_TON_WALLET,
            amount: amountInNano
          }
        ]
      };

      try {
        payBtn.disabled = true;
        payBtn.textContent = 'Processing...';
        
        const result = await tonConnectUI.sendTransaction(transaction);
        
        // Transaction successful in wallet
        status.textContent = '✅ Transaction successful! Adding coins...';
        
        // Send data back to Telegram Bot (Railway)
        if (window.Telegram && Telegram.WebApp) {
           Telegram.WebApp.sendData(JSON.stringify({
              action: "deposit_success",
              amount: amount
           }));
        }

      } catch (e) {
        console.error(e);
        status.textContent = '❌ Transaction failed or cancelled.';
        alert('Transaction error: ' + (e.message || 'Cancelled'));
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = 'Pay & Deposit';
      }
    });

    load(0);
  </script>
</body>
</html>
